schema: custom

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  stroke-board — プロジェクトを起こす「ストローク」と、起きたプロジェクトを見張る
  「ポータル」を1つにした Nuxt アプリ。旧 stroke-board-frontier は統合済み
  （docs/mainline-merge.md / docs/adr/0002-merge-into-stroke-board.md）。

  artifact を書く前に、次の3つを必ず読むこと。

  - `.scratch/stroke-board-frontier/decisions.md`
    grilling セッションで確定した決定事項。プロダクト・画面・生成物・技術の全決定と、
    保留事項・未確認事項が入っている。ここに書かれた決定を覆す提案をしないこと。
  - `CONTEXT.md`
    ドメイン用語集。ストローク / 把握完了 / proposal / 差し戻し / 承認 など。
    artifact 内でドメイン概念を指すときは、この用語をそのまま使うこと。
  - `docs/adr/`
    後から変えにくい決定の記録。矛盾する提案をする場合は、その旨を明示すること。

rules:
  tasks:
    - 成果物を git に入れるところまでを1本の change の範囲とする。tasks の最後に
      commit を1項目置くこと。個々のタスクに commit を混ぜず、まとめて1つにする

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - 全タスクを終えたら、その change の成果物を commit すること。tasks に
        commit の項目が無い場合も、実装が未コミットのまま完了としない。
        commit しないのは、ユーザーが明示的にそう指示したときだけとする
  archive:
    guidance:
      - archive の前に、その change の成果物が commit 済みであることを確かめる。
        未コミットのまま archive すると、change は閉じたのに成果物が git に
        入っていない状態になる
