schema: specs-with-grill

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  ## ***approval requst rule (MUST):***
  ユーザーからapprovalのrequestを求められたartifactはstatusでのapproval状態を
  必ず確認しろ。requestを求められてない場合を除きstatusがapprovalになる前に勝手に
  次のphaseへの着手は絶対禁止

  ## artifact を書く前に、次の3つを必ず読むこと。
  - `.scratch/stroke-board-frontier/decisions.md`
    grilling セッションで確定した決定事項。プロダクト・画面・生成物・技術の全決定と、
    保留事項・未確認事項が入っている。ここに書かれた決定を覆す提案をしないこと。
  - `CONTEXT.md`
    ドメイン用語集。ストローク / 把握完了 / proposal / 差し戻し / 承認 など。
    artifact 内でドメイン概念を指すときは、この用語をそのまま使うこと。
  - `docs/specs/`
    ユーザーとの合意を経て定義された ***真の仕様書*** 実装としての正しさはここにある
    資料の内容との整合性でのみ担保される。
  - `docs/adr/`
    後から変えにくい決定の記録。矛盾する提案をする場合は、その旨を明示すること。
    決定内容はエージェントによる独断記述が含まれるため過信しない。adrを引き出しにする
    場合は都度、その正しさをユーザーに確認しろ。食い違いがあれば修正を常に入れろ

  以下を ***Skill*** toolでロード（MUST)

  - '/coding-standardst', '/contract-first', '/api-design' '/nuxt4-patterns'

rules:
  proposal:
    - use '/AskUserQuestoin`(MUST)
  tasks:
    - >-
      'typescript-reviewer' エージェントに '/santa-method' でレビュー実行を
      必ず最後のタスクに含めろ。レビューが完全にパスするまで続けろ。tasks実行
      の必須。いかなるルールよりも優先（MUST)
    - >-
      tasksの最後に必ずユーザーから完了承認を得るタスクは必須で入れる（MUST）

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - apply の最初に `openspec/tickets/<change-id>.md` の `status` を
        `Doing` へ書き換える。**`status` が `Doing` でない状態で tasks の
        チェックボックスを付けてはならない。**。規定は
        `docs/agents/ticket-labels.md`「Doing」

      - `openspec/tickets/<change-id>.md` の `tags` へ既に同じ物がある場合を除き
        `<ブランチ名>/<セッション ID>` を追記する。`tags` は追記のみで、
        作業が完了しても既存の項目を消さない。担当が変わったら同じ形式で
        さらに追記する。規定は `docs/agents/issue-tracker.md`「ticket の起票」

  archive:
    guidance:
      - archive の前に、その change の成果物が commit 済みであることを確かめる。
        未コミットのまま archive すると、change は閉じたのに成果物が git に
        入っていない状態になる
